<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Donación Para La Vida</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10281a;--side:#12301f;--paper:#f5f6f2;--card:#fff;--line:#e4e7df;--mute:#6b7568;--g:#2d7a4a;--amber:#b45309;--amberbg:#fef3c7;--red:#b91c1c;--redbg:#fee2e2;--okbg:#dcfce7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--g);outline-offset:2px}
#login{max-width:340px;margin:18vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
#login h2{font-size:1.3rem;margin-bottom:6px}#login p{color:var(--mute);margin-bottom:16px}
input,textarea,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:150px;resize:vertical;line-height:1.5}
.btn{background:var(--g);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:600}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.red{background:var(--red)}.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
.err{color:var(--red);margin-top:10px;display:none}
#app{display:none;min-height:100vh}
aside{position:fixed;inset:0 auto 0 0;width:250px;background:var(--side);color:#cfe0d4;padding:22px 14px;display:flex;flex-direction:column;gap:4px}
aside .brand{color:#fff;font-weight:800;font-size:1.02rem;padding:0 10px 18px;line-height:1.25}
aside .brand small{display:block;color:#8fb09b;font-weight:500;font-size:12px;margin-top:3px}
.nav{display:flex;align-items:center;gap:12px;background:none;border:0;color:inherit;text-align:left;padding:10px;border-radius:9px;font-size:14px;font-weight:500}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:#fff;color:var(--ink);font-weight:700}
.nav svg{width:19px;height:19px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav i{margin-left:auto;font-style:normal;font-size:11.5px;background:rgba(255,255,255,.16);border-radius:20px;padding:1px 8px}
.nav.on i{background:var(--okbg);color:var(--g)}
aside .out{margin-top:6px}
main{margin-left:250px;padding:36px 48px 70px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid var(--line)}h1{font-size:1.8rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}.sub{color:var(--mute)}.date{color:var(--mute);font-size:13px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 1px 2px rgba(16,40,26,.04)}
.grid .stat:nth-child(1){background:#e7f3eb}.grid .stat:nth-child(2){background:#fdf3d8}.grid .stat:nth-child(3){background:#12301f;color:#fff}.grid .stat:nth-child(3) span{color:#a9c7b5}.stat b{display:block;font-size:2rem;font-weight:800;letter-spacing:-.02em;margin-top:6px}.stat span{color:var(--mute);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:10px}.bar div{height:100%;background:var(--g)}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.tools input{flex:1;min-width:180px}.tools select{width:auto}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(16,40,26,.04)}
table{width:100%;border-collapse:collapse;min-width:720px}tbody tr:hover{background:#fafbf8}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;padding:13px 18px;background:#fafbf8;border-bottom:1px solid var(--line)}
td{padding:15px 18px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border:0}
.badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--amberbg);color:var(--amber)}
.badge.Verificado{background:var(--okbg);color:var(--g)}.badge.Rechazado,.badge.Eliminado{background:var(--redbg);color:var(--red)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:34px;text-align:center;color:var(--mute)}
.row{display:flex;align-items:center;gap:10px;margin-bottom:8px}.row .nm{width:110px;font-weight:600;flex-shrink:0}.row .val{flex:1}
.hbar{flex:1;height:22px;background:var(--line);border-radius:6px;overflow:hidden}.hbar div{height:100%;background:var(--g);border-radius:6px}
.row .amt{width:80px;text-align:right;font-weight:700}
.f{margin-bottom:14px}.f label{display:block;font-weight:600;margin-bottom:6px}.f small{color:var(--mute);display:block;margin-top:4px}
.sec{margin-bottom:22px}.sec h3{font-size:1.02rem;margin-bottom:12px}
.sw{display:flex;align-items:center;gap:8px;width:120px;flex-shrink:0;font-weight:600}.sw input{width:auto}
.who{display:flex;align-items:center;gap:12px}.av{width:38px;height:38px;border-radius:50%;background:#dcefe2;color:var(--g);display:grid;place-items:center;font-weight:800;flex-shrink:0}.chip{background:#eef1ea;border-radius:7px;padding:3px 9px;font-size:13px;font-weight:500}.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.pill{background:#fff;border:1.5px solid var(--line);border-radius:30px;padding:8px 16px;font-weight:600;font-size:13.5px;color:var(--ink)}.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}.me{display:flex;align-items:center;gap:10px;padding:12px 10px;margin-top:auto;border-top:1px solid rgba(255,255,255,.1)}.me .av{background:#2d7a4a;color:#fff;width:34px;height:34px}.me b{color:#fff;font-size:13.5px;display:block}.me small{font-size:12px;color:#8fb09b}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:14px}.card h3{font-size:1.02rem;margin-bottom:14px}.dn{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.dn svg{width:170px;height:170px;flex-shrink:0}.lgs{flex:1;min-width:190px}.lg{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}.lg:last-child{border:0}.lg i{width:11px;height:11px;border-radius:50%;flex-shrink:0}.lg span{flex:1}.lg em{font-style:normal;color:var(--mute);width:38px;text-align:right}
#modal{position:fixed;inset:0;background:rgba(10,25,15,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
#modal .box{background:#fff;border-radius:14px;padding:24px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
#modal dl{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;margin:14px 0}#modal dt{color:var(--mute)}#modal dd{word-break:break-word}
#modal img{width:100%;border-radius:10px;border:1px solid var(--line);margin-top:6px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;display:none;z-index:30}
@media(max-width:800px){aside{position:static;width:auto;flex-direction:row;flex-wrap:wrap;padding:12px}aside .brand{width:100%;padding-bottom:6px}aside .out{margin:0 0 0 auto}main{margin:0;padding:20px 16px}}
</style>
</head>
<body>

<div id="login">
  <h2>Acceso privado</h2>
  <p>Ingresá la clave para abrir el panel.</p>
  <input type="password" id="pass" placeholder="Clave" autocomplete="current-password">
  <button class="btn" id="loginBtn" style="width:100%;margin-top:12px">Entrar</button>
  <p class="err" id="loginErr">Clave incorrecta.</p>
</div>

<div id="app">
  <aside>
    <div class="brand">Donación Para La Vida<small>Panel de administración</small></div>
    <button class="nav" data-v="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button class="nav" data-v="donaciones"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-9.3-9A5.4 5.4 0 0 1 12 6a5.4 5.4 0 0 1 9.3 6c-2.3 4.6-9.3 9-9.3 9z"/></svg>Donaciones <i id="n-don">0</i></button>
    <button class="nav" data-v="finanzas"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Finanzas</button>
    <button class="nav" data-v="eliminados"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Eliminados <i id="n-del">0</i></button>
    <button class="nav" data-v="config"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M16 4v4M10 10v4M18 16v4"/></svg>Configuración</button>
    <div class="me"><span class="av">A</span><div><b>Administrador</b><small>Sesión activa</small></div></div>
    <button class="nav out" id="logout"><svg viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>Cerrar sesión</button>
  </aside>
  <main id="main"></main>
</div>

<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbz4hD-OTEVApIIFDPfj2OeKd9Ov62XDVFRW6xTs0DcTSIVRbZI2mXDYjyST_bXOiS4V/exec';
const METHODS = [
  { name: 'PayPal', label: 'Correo', addr: 'fenixgestiondenominas@gmail.com' },
  { name: 'Binance Pay', label: 'ID de Binance', addr: '1118270464', qr: true },
  { name: 'Bitcoin', label: 'Dirección BTC', addr: '16d2NhK9XCFoNDobVY2kPPAt92ee93axrP', qr: true },
  { name: 'Tether', label: 'Dirección USDT (TRC20)', addr: 'TM7C1tpPaUEMVpEALmrgRMZ6GDsTSdMK7B', qr: true },
];
let key = '', recs = [], cfg = {}, view = 'inicio', q = '', st = '';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + (Math.round(n * 100) / 100).toLocaleString('es-CO');
const amt = r => parseFloat(r.amount) || 0;
const live = () => recs.filter(r => r.status !== 'Eliminado');
const fmtDate = d => { const x = new Date(d); return isNaN(x) ? '' : x.toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', year: 'numeric' }); };
const head = (t, sub) => `<div class="head"><div><h1>${t}</h1><p class="sub">${sub}</p></div><span class="date">${new Date().toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' }).replace(/^./, c => c.toUpperCase())}</span></div>`;
const who = r => `<div class="who"><span class="av">${esc((r.name || '?').trim().charAt(0).toUpperCase())}</span><div><b>${esc(r.name || 'Sin nombre')}</b><br><span style="color:var(--mute);font-size:13px">${esc(r.email)}</span></div></div>`;
function toast(t, ms) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', ms || 2600); }

async function post(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, key }) });
  const d = await r.json(); if (!d.success) throw new Error(d.error || 'Error');
  if (['trash', 'restore', 'saveConfig', 'changeKey', 'uploadImage'].includes(body.action) && d.action !== body.action)
    throw new Error('El Apps Script no está actualizado. Pegá el código nuevo y creá una nueva versión en Implementar → Administrar implementaciones.');
  return d;
}
async function load() {
  const [a, c] = await Promise.all([
    fetch(API + '?key=' + encodeURIComponent(key)).then(r => r.json()),
    fetch(API + '?action=config').then(r => r.json()),
  ]);
  if (!a.success) throw new Error(a.error || 'No autorizado');
  recs = a.records || []; cfg = c.config || {}; draft = null;
}

async function login() {
  key = $('pass').value; $('loginBtn').disabled = true; $('loginErr').style.display = 'none';
  try { await load(); $('login').style.display = 'none'; $('app').style.display = 'block'; go('inicio'); }
  catch (e) { $('loginErr').textContent = e.message === 'No autorizado' ? 'Clave incorrecta.' : 'No se pudo conectar. Intentá de nuevo.'; $('loginErr').style.display = 'block'; $('pass').value = ''; }
  $('loginBtn').disabled = false;
}
$('loginBtn').onclick = login;
$('pass').onkeydown = e => { if (e.key === 'Enter') login(); };
$('logout').onclick = () => { key = ''; recs = []; $('app').style.display = 'none'; $('login').style.display = 'block'; $('pass').value = ''; };
document.querySelectorAll('.nav[data-v]').forEach(b => b.onclick = () => go(b.dataset.v));

async function refresh(msg) { try { await load(); render(); if (msg) toast(msg); } catch (e) { toast(e.message); } }
function go(v) { view = v; render(); }
function render() {
  document.querySelectorAll('.nav[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('n-don').textContent = live().length; $('n-del').textContent = recs.length - live().length;
  ({ inicio: vInicio, donaciones: vDon, finanzas: vFin, eliminados: vDel, config: vCfg })[view]();
}

// ---------- Inicio ----------
function vInicio() {
  const L = live(), max = cfg.maxDonors || 1000, pct = Math.min(100, L.length / max * 100);
  const by = s => L.filter(r => r.status === s);
  const last = [...L].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
  $('main').innerHTML = `${head('Inicio','Así va la campaña hoy.')}
  <div class="grid">
    <div class="card stat"><span>Donaciones registradas</span><b>${L.length}</b></div>
    <div class="card stat"><span>Por revisar</span><b>${by('Pendiente').length}</b></div>
    <div class="card stat"><span>Verificado</span><b>${money(by('Verificado').reduce((s, r) => s + amt(r), 0))}</b></div>
    <div class="card stat"><span>Cupo usado</span><b>${L.length} de ${max}</b><div class="bar"><div style="width:${pct}%"></div></div></div>
  </div>
  <h3 style="margin-bottom:10px">Últimas donaciones</h3>
  <div class="wrap">${last.length ? `<table><tbody>${last.map(r => `<tr><td>${who(r)}</td><td>${money(amt(r))}</td><td><span class="chip">${esc(r.method)}</span></td><td><span class="badge ${esc(r.status)}">${esc(r.status)}</span></td><td style="color:var(--mute)">${fmtDate(r.date)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Todavía no hay donaciones.</div>'}</div>`;
}

// ---------- Donaciones ----------
function vDon() {
  $('main').innerHTML = `${head('Donaciones','Revisá cada comprobante y confirmá el pago.')}
  <div class="pills">${[["", "Todas"], ["Pendiente", "Pendientes"], ["Verificado", "Verificadas"], ["Rechazado", "Rechazadas"]].map(([v, l]) => `<button class="pill ${st === v ? 'on' : ''}" data-a="flt" data-id="${v}">${l} <span style="opacity:.6">${v ? live().filter(r => r.status === v).length : live().length}</span></button>`).join('')}</div>
  <div class="tools"><input id="q" placeholder="Buscar por nombre o correo" value="${esc(q)}">
  
  <button class="btn ghost" id="rf">Actualizar</button><button class="btn ghost" id="csv">Descargar CSV</button></div>
  <div class="wrap" id="tb"></div>`;
  $('q').oninput = e => { q = e.target.value; table(); };
  $('rf').onclick = () => refresh('Datos actualizados'); $('csv').onclick = csv; table();
}
function table() {
  const s = q.trim().toLowerCase();
  const L = live().filter(r => (!s || (r.name + ' ' + r.email).toLowerCase().includes(s)) && (!st || r.status === st)).sort((a, b) => new Date(b.date) - new Date(a.date));
  $('tb').innerHTML = !L.length ? '<div class="empty">No hay donaciones con ese filtro.</div>' :
    `<table><thead><tr><th>Donante</th><th>Monto</th><th>Método</th><th>Estado</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody>${L.map(r => `<tr>
    <td>${who(r)}</td><td><b>${money(amt(r))}</b></td><td><span class="chip">${esc(r.method)}</span></td>
    <td><span class="badge ${esc(r.status)}">${esc(r.status)}</span></td><td style="color:var(--mute)">${fmtDate(r.date)}</td>
    <td><div class="acts"><button class="btn ghost sm" data-a="ver" data-id="${esc(r.id)}">Ver</button><button class="btn sm" data-a="ok" data-id="${esc(r.id)}">Verificar</button><button class="btn ghost sm" data-a="no" data-id="${esc(r.id)}">Rechazar</button><button class="btn ghost sm" data-a="trash" data-id="${esc(r.id)}">Eliminar</button></div></td></tr>`).join('')}</tbody></table>`;
}
function csv() {
  const rows = [['ID', 'Fecha', 'Nombre', 'Correo', 'Monto', 'Método', 'Estado'], ...live().map(r => [r.id, r.date, r.name, r.email, r.amount, r.method, r.status])];
  const t = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + t], { type: 'text/csv;charset=utf-8' })); a.download = 'donaciones.csv'; a.click();
}

// ---------- Finanzas ----------
const MCOL = { PayPal: '#0070ba', 'Binance Pay': '#f0b90b', Bitcoin: '#f7931a', Tether: '#26a17b' };
function donut(items, label) {
  const list = items.filter(i => i[1] > 0), tot = list.reduce((s, i) => s + i[1], 0);
  if (!tot) return '<p class="empty">Sin datos todavía.</p>';
  const R = 62, C = 2 * Math.PI * R; let off = 0;
  const arcs = list.map(([n, v, c]) => { const len = v / tot * C; const a = `<circle cx="80" cy="80" r="${R}" fill="none" stroke="${c}" stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`; off += len; return a; }).join('');
  const lg = list.map(([n, v, c]) => `<div class="lg"><i style="background:${c}"></i><span>${esc(n)}</span><b>${money(v)}</b><em>${Math.round(v / tot * 100)}%</em></div>`).join('');
  return `<div class="dn"><svg viewBox="0 0 160 160" role="img" aria-label="${esc(label)}">${arcs}<text x="80" y="76" text-anchor="middle" font-size="11" fill="#6b7568">Total</text><text x="80" y="95" text-anchor="middle" font-size="15" font-weight="800" fill="#10281a">${money(tot)}</text></svg><div class="lgs">${lg}</div></div>`;
}
function cols(list) {
  if (!list.length) return '<p class="empty">Sin datos todavía.</p>';
  const mx = Math.max(...list.map(x => x[1]), 1), W = 560, H = 200, pad = 24, step = (W - pad * 2) / list.length, bw = Math.min(56, step - 18);
  return `<svg viewBox="0 0 ${W} ${H + 32}" style="width:100%;height:auto" role="img" aria-label="Donaciones por mes"><line x1="${pad}" x2="${W - pad}" y1="${H}" y2="${H}" stroke="#e4e7df"/>${list.map(([l, v], i) => { const h = v / mx * (H - 34), x = pad + step * i + (step - bw) / 2; return `<rect x="${x}" y="${H - h}" width="${bw}" height="${h}" rx="6" fill="#2d7a4a"/><text x="${x + bw / 2}" y="${H - h - 8}" text-anchor="middle" font-size="12" font-weight="700" fill="#10281a">${money(v)}</text><text x="${x + bw / 2}" y="${H + 20}" text-anchor="middle" font-size="12" fill="#6b7568">${esc(l)}</text>`; }).join('')}</svg>`;
}
function vFin() {
  const L = live(), sum = s => L.filter(r => r.status === s).reduce((t, r) => t + amt(r), 0);
  const OK = L.filter(r => r.status !== 'Rechazado');
  const byM = {}; OK.forEach(r => { const k = r.method || 'Sin método'; byM[k] = (byM[k] || 0) + amt(r); });
  const byMonth = {}; OK.forEach(r => { const d = new Date(r.date); if (isNaN(d)) return; const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); byMonth[k] = (byMonth[k] || 0) + amt(r); });
  const months = Object.keys(byMonth).sort().slice(-6).map(k => { const [y, m] = k.split('-'); return [new Date(y, m - 1, 1).toLocaleDateString('es-CO', { month: 'short', year: '2-digit' }), byMonth[k]]; });
  $('main').innerHTML = `${head('Finanzas', 'Cómo se reparte el dinero. Por método y por mes no se cuentan las rechazadas.')}
  <div class="grid"><div class="card stat"><span>Verificado</span><b>${money(sum('Verificado'))}</b></div><div class="card stat"><span>Pendiente de revisar</span><b>${money(sum('Pendiente'))}</b></div><div class="card stat"><span>Rechazado</span><b>${money(sum('Rechazado'))}</b></div></div>
  <div class="two"><div class="card"><h3>Por estado</h3>${donut([['Verificado', sum('Verificado'), '#2d7a4a'], ['Pendiente', sum('Pendiente'), '#e0a21b'], ['Rechazado', sum('Rechazado'), '#c93c3c']], 'Montos por estado')}</div>
  <div class="card"><h3>Por método de pago</h3>${donut(Object.entries(byM).map(([k, v]) => [k, v, MCOL[k] || '#8a948b']), 'Montos por método')}</div></div>
  <div class="card"><h3>Donaciones por mes</h3>${cols(months)}</div>`;
}

// ---------- Eliminados ----------
function vDel() {
  const D = recs.filter(r => r.status === 'Eliminado');
  $('main').innerHTML = `${head('Eliminados','Podés restaurar una donación o borrarla para siempre.')}<div class="wrap">${!D.length ? '<div class="empty">No hay donaciones eliminadas.</div>' :
    `<table><tbody>${D.map(r => `<tr><td>${who(r)}</td><td>${money(amt(r))}</td><td><span class="chip">${esc(r.method)}</span></td><td style="color:var(--mute)">${fmtDate(r.date)}</td>
    <td><div class="acts"><button class="btn sm" data-a="restore" data-id="${esc(r.id)}">Restaurar</button><button class="btn red sm" data-a="purge" data-id="${esc(r.id)}">Borrar para siempre</button></div></td></tr>`).join('')}</tbody></table>`}</div>`;
}

// ---------- Configuración ----------
const DEF = { maxDonors: 100000, accent: '#2d7a4a', heroImage: '', heroTitle: 'Cada *donación* cambia una vida.', heroSub: 'Tu aporte llega directo a niños en comunidades vulnerables de América Latina.', campBeneficiary: '', campTitle: '', campWho: '', campUse: '', emailSubject: '', emailBody: '' };
const TABS = [['apariencia', 'Apariencia'], ['textos', 'Textos de la página'], ['cupo', 'Cupo de donantes'], ['metodos', 'Métodos de pago'], ['correo', 'Correo de confirmación'], ['clave', 'Cambiar clave de acceso']];
const SW = ['#2d7a4a', '#1d6fb8', '#7c3aed', '#be185d', '#c2410c', '#0f766e'];
let draft = null, ctab = 'apariencia';
const fld = (k, label, ph, rows, hint) => `<div class="f"><label for="d-${k}">${label}</label>${rows ? `<textarea id="d-${k}" data-k="${k}" placeholder="${esc(ph)}" style="min-height:${rows}px">${esc(draft[k])}</textarea>` : `<input id="d-${k}" data-k="${k}" placeholder="${esc(ph)}" value="${esc(draft[k])}">`}${hint ? `<small>${hint}</small>` : ''}</div>`;
const qrBox = (x, c) => !x.qr ? '' : `<div class="row" style="margin:-4px 0 14px 0;align-items:center;gap:12px">
  ${c.qr ? `<img src="${esc(c.qr)}" alt="QR de ${esc(x.name)}" style="width:72px;height:72px;object-fit:contain;border-radius:10px;border:1px solid var(--line);background:#fff">` : '<div style="width:72px;height:72px;border:1.5px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--mute);padding:4px">QR original</div>'}
  <label class="btn ghost" style="cursor:pointer">${c.qr ? 'Cambiar QR' : 'Subir QR'}<input type="file" accept="image/*" hidden data-qrfile="${esc(x.name)}"></label>
  ${c.qr ? `<button class="btn ghost" data-a="noqr" data-id="${esc(x.name)}">Usar QR original</button>` : ''}</div>`;
function vCfg() {
  if (!draft) draft = { ...DEF, ...cfg, methods: JSON.parse(JSON.stringify(cfg.methods || {})) };
  const P = {
    apariencia: `<div class="sec"><h3>Foto de portada</h3>${draft.heroImage ? `<img src="${esc(draft.heroImage)}" alt="Foto de portada actual" style="width:100%;max-width:340px;height:200px;object-fit:cover;border-radius:12px;border:1px solid var(--line)">` : '<div class="empty" style="max-width:340px;border:1.5px dashed var(--line);border-radius:12px;padding:30px">Se usa la foto original de la página.</div>'}
      <div class="tools" style="margin-top:12px"><label class="btn ghost" style="cursor:pointer">Subir otra foto<input type="file" id="photo" accept="image/*" hidden></label>${draft.heroImage ? '<button class="btn ghost" data-a="nophoto">Volver a la foto original</button>' : ''}</div><small style="color:var(--mute)">Mejor una foto vertical. Se ajusta sola y tarda unos segundos en subir.</small></div>
      <div class="sec"><h3>Color principal</h3><div class="row">${SW.map(c => `<button data-a="sw" data-id="${c}" aria-label="Color ${c}" style="width:38px;height:38px;border-radius:50%;border:3px solid ${draft.accent === c ? 'var(--ink)' : '#fff'};background:${c};box-shadow:0 0 0 1px var(--line)"></button>`).join('')}<input type="color" id="d-accent" data-k="accent" value="${esc(draft.accent)}" aria-label="Elegir otro color" style="width:56px;height:40px;padding:2px"></div>
      <button class="btn" id="prev" style="background:${esc(draft.accent)};margin-top:8px" type="button">Así se ve el botón</button></div>`,
    textos: `<div class="sec"><h3>Portada</h3>${fld('heroTitle', 'Título grande', 'Cada *donación* cambia una vida.', 0, 'Poné la palabra resaltada entre asteriscos: *donación*')}${fld('heroSub', 'Frase debajo del título', '', 3)}</div>
      <div class="sec"><h3>Campaña (se muestra arriba del formulario)</h3>${fld('campBeneficiary', 'Apoyo a', '[Beneficiario]')}${fld('campTitle', 'Campaña', '[Título de la campaña]')}${fld('campWho', 'Quién necesita ayuda', '[Describe aquí quién necesita ayuda, la situación y por qué es importante.]', 90)}${fld('campUse', 'En qué se usará el dinero', '[Explica en qué se usará el dinero y adjunta soportes verificables.]', 90, 'Si dejás todo vacío, este recuadro no se muestra.')}</div>`,
    cupo: `<div class="sec"><h3>Cupo de donantes</h3><div class="f"><label for="d-maxDonors">Máximo de donaciones</label><input id="d-maxDonors" data-k="maxDonors" type="number" min="1" value="${esc(draft.maxDonors)}"><small>Al llegar a este número, el formulario se reemplaza por el mensaje de cierre. Escribilo sin puntos: 100000.</small></div></div>`,
    metodos: `<div class="sec"><h3>Métodos de pago</h3>${METHODS.map(x => { const c = draft.methods[x.name] || {}; return `<div class="row"><label class="sw"><input type="checkbox" data-m="${esc(x.name)}" data-f="on" ${c.on === false ? '' : 'checked'}>${x.name}</label><input class="val" data-m="${esc(x.name)}" data-f="addr" aria-label="${esc(x.label)}" placeholder="${esc(x.label)}" value="${esc(c.addr || x.addr)}"></div>${qrBox(x, c)}`; }).join('')}<small style="color:var(--mute)">Desmarcá un método para ocultarlo a los donantes. Si cambiás la dirección y no subís un QR nuevo, la página genera el QR sola con la dirección nueva.</small></div>`,
    correo: `<div class="sec"><h3>Correo de confirmación</h3>${fld('emailSubject', 'Asunto', '')}${fld('emailBody', 'Mensaje', '', 170, 'Usá {nombre} y {monto} para insertar los datos del donante. Se envía al verificar una donación.')}</div>`,
    clave: `<div class="sec"><h3>Cambiar clave de acceso</h3><div class="f"><label for="nk">Nueva clave</label><input id="nk" type="password" autocomplete="new-password"><small>Mínimo 8 caracteres. Vas a seguir dentro del panel con la clave nueva.</small></div><button class="btn" data-a="chk">Cambiar clave</button></div>`,
  };
  $('main').innerHTML = `${head('Configuración', 'Elegí un grupo, hacé los cambios y tocá Guardar cambios.')}
  <div class="pills">${TABS.map(([k, l]) => `<button class="pill ${ctab === k ? 'on' : ''}" data-a="tab" data-id="${k}">${l}</button>`).join('')}</div>
  <div class="card" style="max-width:820px">${P[ctab]}${ctab === 'clave' ? '' : '<button class="btn" data-a="save">Guardar cambios</button>'}</div>`;
}
async function saveCfg() {
  const maxDonors = parseInt(draft.maxDonors, 10);
  if (!maxDonors || maxDonors < 1) return toast('El cupo debe ser un número mayor a 0');
  if (!/^#[0-9a-f]{6}$/i.test(draft.accent)) return toast('Elegí un color válido');
  try { await post({ action: 'saveConfig', config: { ...draft, maxDonors } }); await refresh('Cambios guardados'); } catch (e) { toast(e.message); }
}
async function changeKey() {
  const nk = $('nk').value; if (nk.length < 8) return toast('La clave debe tener al menos 8 caracteres');
  try { await post({ action: 'changeKey', newKey: nk }); key = nk; $('nk').value = ''; toast('Clave cambiada'); } catch (e) { toast(e.message); }
}
function shrink(file, max = 1400, qual = .82) { return new Promise((ok, no) => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', qual)); }; im.onerror = () => no(new Error('No se pudo leer la imagen')); im.src = URL.createObjectURL(file); }); }
$('main').addEventListener('input', e => {
  const t = e.target; if (!draft) return;
  if (t.dataset.k) { draft[t.dataset.k] = t.value; if (t.dataset.k === 'accent' && $('prev')) $('prev').style.background = t.value; }
  else if (t.dataset.m) { const m = draft.methods[t.dataset.m] = draft.methods[t.dataset.m] || {}; if (t.dataset.f === 'on') m.on = t.checked; else m.addr = t.value; }
});
$('main').addEventListener('change', async e => {
  const t = e.target, f = t.files && t.files[0]; if (!f || !draft) return;
  const isQr = !!t.dataset.qrfile;
  if (t.id !== 'photo' && !isQr) return;
  try {
    toast('Subiendo imagen... espera unos segundos', 60000);
    const img = isQr ? await shrink(f, 800, .92) : await shrink(f);
    const d = await post({ action: 'uploadImage', image: img, name: isQr ? 'qr-' + t.dataset.qrfile.replace(/\W+/g, '') : 'portada' });
    if (!/^https:\/\//.test(d.url || '')) throw new Error('El servidor no devolvió el enlace de la imagen');
    if (isQr) { const m = draft.methods[t.dataset.qrfile] = draft.methods[t.dataset.qrfile] || {}; m.qr = d.url; }
    else draft.heroImage = d.url;
    vCfg(); toast('Imagen subida. Tocá Guardar cambios para aplicarla.', 5000);
  } catch (er) { t.value = ''; toast('No se pudo subir: ' + (er instanceof TypeError ? 'sin conexión con el servidor' : er.message), 9000); }
});

// ---------- Acciones (un solo listener) ----------
function detail(r) {
  $('modalBox').innerHTML = `<h2 style="font-size:1.2rem">${esc(r.name)}</h2><span class="badge ${esc(r.status)}">${esc(r.status)}</span>
  <dl><dt>Correo</dt><dd>${esc(r.email)}</dd><dt>Monto</dt><dd><b>${money(amt(r))}</b></dd><dt>Método</dt><dd>${esc(r.method)}</dd><dt>Fecha</dt><dd>${fmtDate(r.date)}</dd><dt>ID</dt><dd>${esc(r.id)}</dd></dl>
  ${r.receipt ? `<b>Comprobante</b><a href="${esc(r.receipt)}" target="_blank" rel="noopener"><img src="${esc(r.receipt)}" alt="Comprobante de pago"></a>` : '<p style="color:var(--mute)">Sin comprobante adjunto.</p>'}
  <button class="btn ghost" style="margin-top:16px" id="x">Cerrar</button>`;
  $('modal').style.display = 'flex'; $('x').onclick = () => $('modal').style.display = 'none';
}
$('modal').onclick = e => { if (e.target.id === 'modal') $('modal').style.display = 'none'; };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('modal').style.display = 'none'; });
$('main').addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const id = b.dataset.id, a = b.dataset.a, r = recs.find(x => String(x.id) === id);
  if (a === 'flt') { st = id; return vDon(); }
  if (a === 'tab') { ctab = id; return vCfg(); }
  if (a === 'sw') { draft.accent = id; return vCfg(); }
  if (a === 'nophoto') { draft.heroImage = ''; return vCfg(); }
  if (a === 'noqr') { if (draft.methods[id]) delete draft.methods[id].qr; return vCfg(); }
  if (a === 'save') return saveCfg();
  if (a === 'chk') return changeKey();
  if (a === 'ver') return detail(r);
  if (a === 'purge' && !confirm('¿Borrar para siempre? Esto no se puede deshacer.')) return;
  const map = { ok: { action: 'updateStatus', status: 'Verificado' }, no: { action: 'updateStatus', status: 'Rechazado' }, trash: { action: 'trash' }, restore: { action: 'restore' }, purge: { action: 'delete' } };
  const done = { ok: 'Donación verificada', no: 'Donación rechazada', trash: 'Movida a Eliminados', restore: 'Donación restaurada', purge: 'Borrada para siempre' };
  b.disabled = true;
  try { await post({ ...map[a], id }); await refresh(done[a]); } catch (er) { toast('No se pudo completar: ' + er.message); b.disabled = false; }
});
</script>
</body>
</html>
