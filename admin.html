<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Donación Para La Vida</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10281a;--side:#12301f;--paper:#f5f6f2;--card:#fff;--line:#e4e7df;--mute:#6b7568;--g:#2d7a4a;--amber:#b45309;--amberbg:#fef3c7;--red:#b91c1c;--redbg:#fee2e2;--okbg:#dcfce7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:14px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--g);outline-offset:2px}
#login{max-width:340px;margin:18vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
#login h2{font-size:1.3rem;margin-bottom:6px}#login p{color:var(--mute);margin-bottom:16px}
input,textarea,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:150px;resize:vertical;line-height:1.5}
.btn{background:var(--g);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:600}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.red{background:var(--red)}.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
.err{color:var(--red);margin-top:10px;display:none}
#app{display:none;min-height:100vh}
aside{position:fixed;inset:0 auto 0 0;width:220px;background:var(--side);color:#cfe0d4;padding:22px 14px;display:flex;flex-direction:column;gap:4px}
aside .brand{color:#fff;font-weight:800;font-size:1.02rem;padding:0 10px 18px;line-height:1.25}
aside .brand small{display:block;color:#8fb09b;font-weight:500;font-size:12px;margin-top:3px}
.nav{display:flex;justify-content:space-between;align-items:center;background:none;border:0;color:inherit;text-align:left;padding:10px;border-radius:9px;font-size:14px;font-weight:500}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:#fff;color:var(--ink);font-weight:700}
.nav i{font-style:normal;font-size:11.5px;background:rgba(255,255,255,.16);border-radius:20px;padding:1px 8px}
.nav.on i{background:var(--okbg);color:var(--g)}
aside .out{margin-top:auto}
main{margin-left:220px;padding:30px 34px;max-width:1100px}
h1{font-size:1.5rem;font-weight:800;margin-bottom:4px}.sub{color:var(--mute);margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.stat b{display:block;font-size:1.7rem;font-weight:800;margin-top:4px}.stat span{color:var(--mute);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:10px}.bar div{height:100%;background:var(--g)}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.tools input{flex:1;min-width:180px}.tools select{width:auto}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-size:12.5px;color:var(--mute);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border:0}
.badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--amberbg);color:var(--amber)}
.badge.Verificado{background:var(--okbg);color:var(--g)}.badge.Rechazado,.badge.Eliminado{background:var(--redbg);color:var(--red)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:34px;text-align:center;color:var(--mute)}
.row{display:flex;align-items:center;gap:10px;margin-bottom:8px}.row .nm{width:110px;font-weight:600;flex-shrink:0}.row .val{flex:1}
.hbar{flex:1;height:22px;background:var(--line);border-radius:6px;overflow:hidden}.hbar div{height:100%;background:var(--g);border-radius:6px}
.row .amt{width:80px;text-align:right;font-weight:700}
.f{margin-bottom:14px}.f label{display:block;font-weight:600;margin-bottom:6px}.f small{color:var(--mute);display:block;margin-top:4px}
.sec{margin-bottom:22px}.sec h3{font-size:1.02rem;margin-bottom:12px}
.sw{display:flex;align-items:center;gap:8px;width:120px;flex-shrink:0;font-weight:600}.sw input{width:auto}
#modal{position:fixed;inset:0;background:rgba(10,25,15,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
#modal .box{background:#fff;border-radius:14px;padding:24px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
#modal dl{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;margin:14px 0}#modal dt{color:var(--mute)}#modal dd{word-break:break-word}
#modal img{width:100%;border-radius:10px;border:1px solid var(--line);margin-top:6px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;display:none;z-index:30}
@media(max-width:800px){aside{position:static;width:auto;flex-direction:row;flex-wrap:wrap;padding:12px}aside .brand{width:100%;padding-bottom:6px}aside .out{margin:0 0 0 auto}main{margin:0;padding:20px 16px}}
</style>
</head>
<body>

<div id="login">
  <h2>Acceso privado</h2>
  <p>Ingresá la clave para abrir el panel.</p>
  <input type="password" id="pass" placeholder="Clave" autocomplete="current-password">
  <button class="btn" id="loginBtn" style="width:100%;margin-top:12px">Entrar</button>
  <p class="err" id="loginErr">Clave incorrecta.</p>
</div>

<div id="app">
  <aside>
    <div class="brand">Donación Para La Vida<small>Panel de administración</small></div>
    <button class="nav" data-v="inicio">Inicio</button>
    <button class="nav" data-v="donaciones">Donaciones <i id="n-don">0</i></button>
    <button class="nav" data-v="finanzas">Finanzas</button>
    <button class="nav" data-v="eliminados">Eliminados <i id="n-del">0</i></button>
    <button class="nav" data-v="config">Configuración</button>
    <button class="nav out" id="logout">Salir</button>
  </aside>
  <main id="main"></main>
</div>

<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxBpzBNxBKJwJasAgzhUEOWLBPJGzOhFnPB7v-YyCWTxaVL-ZHre9wQbTlVwxcCfrLI/exec';
const METHODS = [
  { name: 'PayPal', label: 'Correo', addr: 'fenixgestiondenominas@gmail.com' },
  { name: 'Binance Pay', label: 'ID de Binance', addr: '1118270464' },
  { name: 'Bitcoin', label: 'Dirección BTC', addr: '16d2NhK9XCFoNDobVY2kPPAt92ee93axrP' },
  { name: 'Tether', label: 'Dirección USDT (TRC20)', addr: 'TM7C1tpPaUEMVpEALmrgRMZ6GDsTSdMK7B' },
];
let key = '', recs = [], cfg = {}, view = 'inicio', q = '', st = '';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + (Math.round(n * 100) / 100).toLocaleString('es-CO');
const amt = r => parseFloat(r.amount) || 0;
const live = () => recs.filter(r => r.status !== 'Eliminado');
const fmtDate = d => { const x = new Date(d); return isNaN(x) ? '' : x.toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', year: 'numeric' }); };
function toast(t) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 2600); }

async function post(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, key }) });
  const d = await r.json(); if (!d.success) throw new Error(d.error || 'Error'); return d;
}
async function load() {
  const [a, c] = await Promise.all([
    fetch(API + '?key=' + encodeURIComponent(key)).then(r => r.json()),
    fetch(API + '?action=config').then(r => r.json()),
  ]);
  if (!a.success) throw new Error(a.error || 'No autorizado');
  recs = a.records || []; cfg = c.config || {};
}

async function login() {
  key = $('pass').value; $('loginBtn').disabled = true; $('loginErr').style.display = 'none';
  try { await load(); $('login').style.display = 'none'; $('app').style.display = 'block'; go('inicio'); }
  catch (e) { $('loginErr').textContent = e.message === 'No autorizado' ? 'Clave incorrecta.' : 'No se pudo conectar. Intentá de nuevo.'; $('loginErr').style.display = 'block'; $('pass').value = ''; }
  $('loginBtn').disabled = false;
}
$('loginBtn').onclick = login;
$('pass').onkeydown = e => { if (e.key === 'Enter') login(); };
$('logout').onclick = () => { key = ''; recs = []; $('app').style.display = 'none'; $('login').style.display = 'block'; $('pass').value = ''; };
document.querySelectorAll('.nav[data-v]').forEach(b => b.onclick = () => go(b.dataset.v));

async function refresh(msg) { try { await load(); render(); if (msg) toast(msg); } catch (e) { toast(e.message); } }
function go(v) { view = v; render(); }
function render() {
  document.querySelectorAll('.nav[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('n-don').textContent = live().length; $('n-del').textContent = recs.length - live().length;
  ({ inicio: vInicio, donaciones: vDon, finanzas: vFin, eliminados: vDel, config: vCfg })[view]();
}

// ---------- Inicio ----------
function vInicio() {
  const L = live(), max = cfg.maxDonors || 1000, pct = Math.min(100, L.length / max * 100);
  const by = s => L.filter(r => r.status === s);
  const last = [...L].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
  $('main').innerHTML = `<h1>Inicio</h1><p class="sub">Así va la campaña hoy.</p>
  <div class="grid">
    <div class="card stat"><span>Donaciones registradas</span><b>${L.length}</b></div>
    <div class="card stat"><span>Por revisar</span><b>${by('Pendiente').length}</b></div>
    <div class="card stat"><span>Verificado</span><b>${money(by('Verificado').reduce((s, r) => s + amt(r), 0))}</b></div>
    <div class="card stat"><span>Cupo usado</span><b>${L.length} de ${max}</b><div class="bar"><div style="width:${pct}%"></div></div></div>
  </div>
  <h3 style="margin-bottom:10px">Últimas donaciones</h3>
  <div class="wrap">${last.length ? `<table><tbody>${last.map(r => `<tr><td><b>${esc(r.name)}</b><br><span style="color:var(--mute)">${esc(r.email)}</span></td><td>${money(amt(r))}</td><td>${esc(r.method)}</td><td><span class="badge ${esc(r.status)}">${esc(r.status)}</span></td><td style="color:var(--mute)">${fmtDate(r.date)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Todavía no hay donaciones.</div>'}</div>`;
}

// ---------- Donaciones ----------
function vDon() {
  $('main').innerHTML = `<h1>Donaciones</h1><p class="sub">Revisá cada comprobante y confirmá el pago.</p>
  <div class="tools"><input id="q" placeholder="Buscar por nombre o correo" value="${esc(q)}">
  <select id="st"><option value="">Todos los estados</option>${['Pendiente', 'Verificado', 'Rechazado'].map(s => `<option ${st === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
  <button class="btn ghost" id="rf">Actualizar</button><button class="btn ghost" id="csv">Descargar CSV</button></div>
  <div class="wrap" id="tb"></div>`;
  $('q').oninput = e => { q = e.target.value; table(); }; $('st').onchange = e => { st = e.target.value; table(); };
  $('rf').onclick = () => refresh('Datos actualizados'); $('csv').onclick = csv; table();
}
function table() {
  const s = q.trim().toLowerCase();
  const L = live().filter(r => (!s || (r.name + ' ' + r.email).toLowerCase().includes(s)) && (!st || r.status === st)).sort((a, b) => new Date(b.date) - new Date(a.date));
  $('tb').innerHTML = !L.length ? '<div class="empty">No hay donaciones con ese filtro.</div>' :
    `<table><thead><tr><th>Donante</th><th>Monto</th><th>Método</th><th>Estado</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody>${L.map(r => `<tr>
    <td><b>${esc(r.name || 'Sin nombre')}</b><br><span style="color:var(--mute)">${esc(r.email)}</span></td><td><b>${money(amt(r))}</b></td><td>${esc(r.method)}</td>
    <td><span class="badge ${esc(r.status)}">${esc(r.status)}</span></td><td style="color:var(--mute)">${fmtDate(r.date)}</td>
    <td><div class="acts"><button class="btn ghost sm" data-a="ver" data-id="${esc(r.id)}">Ver</button><button class="btn sm" data-a="ok" data-id="${esc(r.id)}">Verificar</button><button class="btn ghost sm" data-a="no" data-id="${esc(r.id)}">Rechazar</button><button class="btn ghost sm" data-a="trash" data-id="${esc(r.id)}">Eliminar</button></div></td></tr>`).join('')}</tbody></table>`;
}
function csv() {
  const rows = [['ID', 'Fecha', 'Nombre', 'Correo', 'Monto', 'Método', 'Estado'], ...live().map(r => [r.id, r.date, r.name, r.email, r.amount, r.method, r.status])];
  const t = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + t], { type: 'text/csv;charset=utf-8' })); a.download = 'donaciones.csv'; a.click();
}

// ---------- Finanzas ----------
function vFin() {
  const L = live(), sum = s => L.filter(r => r.status === s).reduce((t, r) => t + amt(r), 0);
  const group = f => { const m = {}; L.filter(r => r.status !== 'Rechazado').forEach(r => { const k = f(r); m[k] = (m[k] || 0) + amt(r); }); return Object.entries(m); };
  const bars = (list, mx) => list.length ? list.map(([k, v]) => `<div class="row"><span class="nm">${esc(k)}</span><div class="hbar"><div style="width:${mx ? v / mx * 100 : 0}%"></div></div><span class="amt">${money(v)}</span></div>`).join('') : '<p class="empty">Sin datos todavía.</p>';
  const byM = group(r => r.method || 'Sin método').sort((a, b) => b[1] - a[1]);
  const byMonth = group(r => { const d = new Date(r.date); return isNaN(d) ? 'Sin fecha' : d.toLocaleDateString('es-CO', { month: 'short', year: 'numeric' }); });
  $('main').innerHTML = `<h1>Finanzas</h1><p class="sub">Los montos rechazados y eliminados no se cuentan.</p>
  <div class="grid"><div class="card stat"><span>Verificado</span><b>${money(sum('Verificado'))}</b></div><div class="card stat"><span>Pendiente de revisar</span><b>${money(sum('Pendiente'))}</b></div><div class="card stat"><span>Rechazado</span><b>${money(sum('Rechazado'))}</b></div></div>
  <div class="card sec"><h3>Por método de pago</h3>${bars(byM, Math.max(0, ...byM.map(x => x[1])))}</div>
  <div class="card sec"><h3>Por mes</h3>${bars(byMonth, Math.max(0, ...byMonth.map(x => x[1])))}</div>`;
}

// ---------- Eliminados ----------
function vDel() {
  const D = recs.filter(r => r.status === 'Eliminado');
  $('main').innerHTML = `<h1>Eliminados</h1><p class="sub">Podés restaurar una donación o borrarla para siempre.</p><div class="wrap">${!D.length ? '<div class="empty">No hay donaciones eliminadas.</div>' :
    `<table><tbody>${D.map(r => `<tr><td><b>${esc(r.name)}</b><br><span style="color:var(--mute)">${esc(r.email)}</span></td><td>${money(amt(r))}</td><td>${esc(r.method)}</td><td style="color:var(--mute)">${fmtDate(r.date)}</td>
    <td><div class="acts"><button class="btn sm" data-a="restore" data-id="${esc(r.id)}">Restaurar</button><button class="btn red sm" data-a="purge" data-id="${esc(r.id)}">Borrar para siempre</button></div></td></tr>`).join('')}</tbody></table>`}</div>`;
}

// ---------- Configuración ----------
function vCfg() {
  const m = cfg.methods || {};
  $('main').innerHTML = `<h1>Configuración</h1><p class="sub">Los cambios se aplican en la página de donaciones al guardar.</p>
  <div class="card sec"><h3>Cupo de donantes</h3><div class="f"><label for="max">Máximo de donaciones</label><input id="max" type="number" min="1" value="${esc(cfg.maxDonors || 1000)}"><small>Al llegar a este número, el formulario se reemplaza por el mensaje de cierre.</small></div></div>
  <div class="card sec"><h3>Métodos de pago</h3>${METHODS.map((x, i) => { const c = m[x.name] || {}; return `<div class="row"><label class="sw"><input type="checkbox" id="on${i}" ${c.on === false ? '' : 'checked'}>${x.name}</label><input class="val" id="ad${i}" aria-label="${esc(x.label)}" placeholder="${esc(x.label)}" value="${esc(c.addr || x.addr)}"></div>`; }).join('')}<small style="color:var(--mute)">Desmarcá un método para ocultarlo a los donantes. Los códigos QR no cambian desde acá.</small></div>
  <div class="card sec"><h3>Correo de confirmación</h3><div class="f"><label for="sub">Asunto</label><input id="sub" value="${esc(cfg.emailSubject)}"></div><div class="f"><label for="body">Mensaje</label><textarea id="body">${esc(cfg.emailBody)}</textarea><small>Usá {nombre} y {monto} para insertar los datos del donante. Se envía al verificar una donación.</small></div></div>
  <button class="btn" id="save">Guardar cambios</button>
  <div class="card sec" style="margin-top:26px"><h3>Cambiar clave de acceso</h3><div class="f"><label for="nk">Nueva clave</label><input id="nk" type="password" autocomplete="new-password"><small>Mínimo 8 caracteres. Vas a seguir dentro del panel con la clave nueva.</small></div><button class="btn ghost" id="chk">Cambiar clave</button></div>`;
  $('save').onclick = async () => {
    const methods = {}; METHODS.forEach((x, i) => methods[x.name] = { on: $('on' + i).checked, addr: $('ad' + i).value.trim() });
    const maxDonors = parseInt($('max').value, 10);
    if (!maxDonors || maxDonors < 1) return toast('El cupo debe ser un número mayor a 0');
    try { await post({ action: 'saveConfig', config: { maxDonors, methods, emailSubject: $('sub').value, emailBody: $('body').value } }); await refresh('Configuración guardada'); } catch (e) { toast(e.message); }
  };
  $('chk').onclick = async () => {
    const nk = $('nk').value; if (nk.length < 8) return toast('La clave debe tener al menos 8 caracteres');
    try { await post({ action: 'changeKey', newKey: nk }); key = nk; $('nk').value = ''; toast('Clave cambiada'); } catch (e) { toast(e.message); }
  };
}

// ---------- Acciones (un solo listener) ----------
function detail(r) {
  $('modalBox').innerHTML = `<h2 style="font-size:1.2rem">${esc(r.name)}</h2><span class="badge ${esc(r.status)}">${esc(r.status)}</span>
  <dl><dt>Correo</dt><dd>${esc(r.email)}</dd><dt>Monto</dt><dd><b>${money(amt(r))}</b></dd><dt>Método</dt><dd>${esc(r.method)}</dd><dt>Fecha</dt><dd>${fmtDate(r.date)}</dd><dt>ID</dt><dd>${esc(r.id)}</dd></dl>
  ${r.receipt ? `<b>Comprobante</b><a href="${esc(r.receipt)}" target="_blank" rel="noopener"><img src="${esc(r.receipt)}" alt="Comprobante de pago"></a>` : '<p style="color:var(--mute)">Sin comprobante adjunto.</p>'}
  <button class="btn ghost" style="margin-top:16px" id="x">Cerrar</button>`;
  $('modal').style.display = 'flex'; $('x').onclick = () => $('modal').style.display = 'none';
}
$('modal').onclick = e => { if (e.target.id === 'modal') $('modal').style.display = 'none'; };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('modal').style.display = 'none'; });
$('main').addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const id = b.dataset.id, a = b.dataset.a, r = recs.find(x => String(x.id) === id);
  if (a === 'ver') return detail(r);
  if (a === 'purge' && !confirm('¿Borrar para siempre? Esto no se puede deshacer.')) return;
  const map = { ok: { action: 'updateStatus', status: 'Verificado' }, no: { action: 'updateStatus', status: 'Rechazado' }, trash: { action: 'trash' }, restore: { action: 'restore' }, purge: { action: 'delete' } };
  const done = { ok: 'Donación verificada', no: 'Donación rechazada', trash: 'Movida a Eliminados', restore: 'Donación restaurada', purge: 'Borrada para siempre' };
  b.disabled = true;
  try { await post({ ...map[a], id }); await refresh(done[a]); } catch (er) { toast('No se pudo completar: ' + er.message); b.disabled = false; }
});
</script>
</body>
</html>
